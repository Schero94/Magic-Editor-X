# Checks every pull request and push to a non-main branch on the Node versions
# Strapi 5.63 supports (22, 24 and 26, as engines.node declares): lint,
# formatting, build (with the server bundle runtime check), unit tests, admin
# StrictMode tests (React 18; a separate job runs them on React 19), package
# verification, package contents and a production audit. A second job checks
# that the lockfile installs with npm 10 and npm 11; a third runs the
# performance benchmark against scripts/bench-thresholds.json; a fourth builds
# and tests against the lowest declared peer versions (Strapi 5.38.0, Design
# System 2.2.0), so the peer floor is tested and not only declared; a fifth
# runs the Core Blocks bridge tests on the peer floor and the newest 5.x; a sixth runs the
# browser benchmark and touch checks on a packed build (2.12.1).
# The integration and multi-process suites need a Strapi host; CONTRIBUTING.md
# describes how to run them.
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Build (includes verify:runtime)
        run: npm run build
      - name: Tests
        run: npm test
      - name: Dependency gate unit tests
        run: node --test .github/scripts/dependency-gate.test.mjs

      - name: Showcase script unit tests
        run: node --test .github/scripts/showcase.test.mjs
      - name: Admin StrictMode tests (React 18)
        run: npm run test:admin
      - name: Verify package
        run: npm run verify
      - name: Server bundle runtime check
        run: npm run verify:runtime
      - name: Package contents
        run: npm pack --dry-run
      - name: Packed package installs without EBADENGINE (Node 22)
        if: matrix.node == '22'
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/install-check" && cd "$RUNNER_TEMP/install-check"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/magic-editor-x-*.tgz --ignore-scripts --no-audit --no-fund --legacy-peer-deps --dry-run 2>&1 | tee install.log
          if grep -q EBADENGINE install.log; then echo "EBADENGINE on Node 22"; exit 1; fi
      - name: Production audit
        run: npm audit --omit=dev --audit-level=high

  react-19:
    # The peer range allows React ^18.0.0 || ^19.0.0, so the admin StrictMode tests must pass on
    # React 19 too (blocking). --legacy-peer-deps only for this install: @strapi/icons and
    # @strapi/design-system 2.3.1 declare a React ^18 peer, so npm refuses React 19 otherwise.
    name: Admin StrictMode tests on React 19
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Install React 19 (not saved)
        run: npm install --no-save --ignore-scripts --no-audit --no-fund --legacy-peer-deps react@19 react-dom@19
      - name: Show installed React version
        run: |
          node -e '
            const react = require("react/package.json").version;
            const dom = require("react-dom/package.json").version;
            console.log("react", react, "react-dom", dom);
            if (!react.startsWith("19.") || !dom.startsWith("19.")) throw new Error("React 19 is not installed");'
      - name: Admin StrictMode tests (React 19)
        run: npm run test:admin

  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Lockfile installs with npm 10
        run: npx --yes npm@10 ci --dry-run --ignore-scripts
      - name: Lockfile installs with npm 11
        run: npx --yes npm@11 ci --dry-run --ignore-scripts

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      # The benchmark imports the shared sources directly; no build is needed.
      - name: Benchmark (budgets, scaling, counters)
        run: npm run bench

  browser-bench:
    # Browser benchmark and touch checks (2.12.1, scripts/bench-browser): builds the packed plugin
    # into a throw-away Strapi host (SQLite, loopback only, egress blocked, random secrets), drives
    # the real edit view in headless Chromium with 1,000, 2,000 and 5,000 blocks (load, typing,
    # Enter, paste, panels, save, JS heap after garbage collection) and on Pixel 7 and iPhone 13
    # emulation (tap, toolbox, block menu, inline toolbar, table, More tools, sheets, keyboard,
    # 44 px targets, scroll). The table goes to the job summary and the JSON is kept as an artifact.
    # Budgets marked "enforce" in scripts/bench-browser-budgets.json and the touch checks fail the
    # job; timing budgets are reported only, because shared runners vary (see CONTRIBUTING.md).
    name: Browser benchmark and touch checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Build the SQLite driver for the host
        run: npm rebuild better-sqlite3
      - name: Install headless Chromium for Playwright
        run: npx playwright install --with-deps --only-shell chromium
      - name: Build and pack the plugin
        run: |
          npm run build
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Browser benchmark and touch checks
        run: >-
          npm run bench:browser -- --suite all --enforce
          --tarball "$(ls "$RUNNER_TEMP"/magic-editor-x-*.tgz)"
          --out "$RUNNER_TEMP/bench-browser.json"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-browser
          path: ${{ runner.temp }}/bench-browser.json
          if-no-files-found: warn
          retention-days: 14

  core-blocks:
    # Core Blocks bridge (2.7): the bridge wraps Strapi's entity validator, an internal hook point.
    # Its tests run on Strapi's real validator and on a programmatic Strapi boot (SQLite, Document
    # Service create, update and publish) against the peer floor and the newest 5.x on every PR,
    # so a Strapi change that moves or changes the hook point fails here before a release.
    name: Core Blocks bridge on Strapi ${{ matrix.strapi }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Keep the first entry in sync with FLOOR_STRAPI (peer floor); `newest-5` resolves at run time.
        strapi: ['5.38.0', 'newest-5']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Strapi 5.38 declares node <=24.x; 22 is the floor of engines.node.
          node-version: '22'
          cache: npm
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Install the Strapi version under test (no lifecycle scripts)
        env:
          STRAPI_UNDER_TEST: ${{ matrix.strapi }}
        run: |
          version="$STRAPI_UNDER_TEST"
          if [ "$version" = "newest-5" ]; then
            version="$(npm view '@strapi/strapi@>=5 <6' version --json | node -e 'let s="";process.stdin.on("data",(c)=>s+=c).on("end",()=>{const v=JSON.parse(s);console.log(Array.isArray(v)?v[v.length-1]:v)})')"
          fi
          echo "Strapi under test: $version"
          npm install --no-save --ignore-scripts --no-audit --no-fund "@strapi/strapi@$version" "@strapi/utils@$version"
          node -e '
            const want = process.argv[1];
            for (const name of ["@strapi/strapi", "@strapi/core", "@strapi/utils"]) {
              const installed = require(name + "/package.json").version;
              console.log(name, installed);
              if (installed !== want) throw new Error(name + " is " + installed + ", expected " + want);
            }' "$version"
      - name: Build the SQLite driver for the Strapi boot test
        run: npm rebuild better-sqlite3
      - name: Build (includes verify:runtime)
        run: npm run build
      - name: Core Blocks bridge tests (real entity validator and Strapi boot)
        run: npm run test:core-blocks

  peer-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep in sync with the lowest versions in package.json peerDependencies.
      FLOOR_STRAPI: '5.38.0'
      FLOOR_DESIGN_SYSTEM: '2.2.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Strapi 5.38 declares node <=24.x; 22 is the floor of engines.node.
          node-version: '22'
          cache: npm
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Install the peer floor (no lifecycle scripts)
        run: >-
          npm install --no-save --ignore-scripts --no-audit --no-fund
          "@strapi/strapi@$FLOOR_STRAPI" "@strapi/utils@$FLOOR_STRAPI"
          "@strapi/design-system@$FLOOR_DESIGN_SYSTEM" "@strapi/icons@$FLOOR_DESIGN_SYSTEM"
      - name: Peer floor is installed
        run: |
          node -e '
            const want = { "@strapi/strapi": process.env.FLOOR_STRAPI, "@strapi/utils": process.env.FLOOR_STRAPI,
              "@strapi/design-system": process.env.FLOOR_DESIGN_SYSTEM, "@strapi/icons": process.env.FLOOR_DESIGN_SYSTEM };
            for (const [name, version] of Object.entries(want)) {
              const installed = require(name + "/package.json").version;
              console.log(name, installed);
              if (installed !== version) throw new Error(name + " is " + installed + ", expected " + version);
            }'
      - name: Peer range starts at the floor
        run: |
          node -e '
            const peers = require("./package.json").peerDependencies;
            const want = { "@strapi/strapi": "^" + process.env.FLOOR_STRAPI, "@strapi/utils": "^" + process.env.FLOOR_STRAPI,
              "@strapi/design-system": "^" + process.env.FLOOR_DESIGN_SYSTEM, "@strapi/icons": "^" + process.env.FLOOR_DESIGN_SYSTEM };
            for (const [name, range] of Object.entries(want))
              if (peers[name] !== range) throw new Error(name + " peer is " + peers[name] + ", the floor job tests " + range);'
      - name: Build (includes verify:runtime)
        run: npm run build
      - name: Tests
        run: npm test
